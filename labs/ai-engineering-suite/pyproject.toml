[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aieng-systems"
version = "0.1.0"
description = "Small implementations of common LLM infrastructure components"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
aieng = "aieng.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
