[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "self-hosted-inference-server"
version = "0.1.0"
description = "Reproducible vLLM serving configuration and verification utilities."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "typer>=0.12"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["mypy>=1.11", "ruff>=0.8"]

[project.scripts]
inference-server = "inference_server.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
