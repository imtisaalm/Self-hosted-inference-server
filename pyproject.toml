[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "self-hosted-inference-server"
version = "0.1.0"
description = "Configuration and measurement utilities for a self-hosted vLLM inference endpoint."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "typer>=0.12"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
inference-server = "inference_server.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
